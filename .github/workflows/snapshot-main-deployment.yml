name: Snapshot main ETF deployment

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Print latest main deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "/repos/${GH_REPO}/actions/workflows/daily-analysis.yml/runs?branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0] | {id, status, conclusion, html_url, head_sha, created_at, updated_at}'
