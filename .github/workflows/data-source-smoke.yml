name: Public data source smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Query Sina and SSE history
        run: |
          python - <<'PY'
          import time
          import akshare as ak

          index = ak.stock_zh_index_daily(symbol="sh000300")
          print("SINA_INDEX", len(index), index.tail(1).to_dict("records"))

          etf = ak.fund_etf_hist_sina(symbol="sh510300")
          print("SINA_ETF", len(etf), etf.tail(1).to_dict("records"))

          for date in ("20200102", "20220104", "20260717"):
              started = time.perf_counter()
              shares = ak.fund_etf_scale_sse(date=date)
              selected = shares[shares["基金代码"].astype(str).str.zfill(6) == "510300"]
              elapsed = time.perf_counter() - started
              print("SSE_SHARE", date, round(elapsed, 3), len(shares), selected.to_dict("records"))
          PY
