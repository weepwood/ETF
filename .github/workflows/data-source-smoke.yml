name: Public data source smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Query Sina and SSE
        run: |
          python - <<'PY'
          import akshare as ak

          index = ak.stock_zh_index_daily(symbol="sh000300")
          print("SINA_INDEX", len(index), index.tail(1).to_dict("records"))

          etf = ak.fund_etf_hist_sina(symbol="sh510300")
          print("SINA_ETF", len(etf), etf.tail(1).to_dict("records"))

          shares = ak.fund_etf_scale_sse(date="20260717")
          selected = shares[shares["基金代码"].astype(str).str.zfill(6) == "510300"]
          print("SSE_SHARE", len(shares), selected.to_dict("records"))
          PY
