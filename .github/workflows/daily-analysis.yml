name: Daily ETF analysis

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 13:23 UTC = 21:23 China / 22:23 Japan.
    - cron: "23 13 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: etf-daily-analysis
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore rolling raw-data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: etf-raw-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            etf-raw-${{ runner.os }}-

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Tushare secret
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "Repository secret TUSHARE_TOKEN is required." >&2
            exit 1
          fi

      - name: Refresh data and build analysis
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: etf-flow refresh --config configs/strategy.example.yaml --lookback-days 21

      - name: Verify generated outputs
        run: |
          test -s reports/index.html
          test -s reports/latest.json
          test -s reports/metrics.json
          test -s reports/event_study.csv
          pytest -q

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp reports/index.html _site/index.html
          cp reports/*.json _site/
          cp reports/*.csv _site/
          touch _site/.nojekyll

      - name: Upload analysis files
        uses: actions/upload-artifact@v4
        with:
          name: etf-analysis-${{ github.run_number }}
          path: |
            reports/
            data/processed/
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
